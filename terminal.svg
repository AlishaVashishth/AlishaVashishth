<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" viewBox="0 0 860 490" role="img" aria-label="Terminal view: whoami, builds, stack, certs and status for Alisha Vashishth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10192e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="win"><rect x="0" y="0" width="860" height="490" rx="14"/></clipPath>
    <clipPath id="c1"><rect x="40" y="70" width="0" height="30"><animate attributeName="width" from="0" to="110" dur="0.8s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="130" width="0" height="30"><animate attributeName="width" from="0" to="190" dur="1.1s" begin="2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="259" width="0" height="30"><animate attributeName="width" from="0" to="170" dur="1s" begin="5.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="319" width="0" height="30"><animate attributeName="width" from="0" to="170" dur="1s" begin="7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="379" width="0" height="30"><animate attributeName="width" from="0" to="160" dur="1s" begin="8.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace; font-size: 16px; }
    .p { fill: #14B8A6; }
    .c { fill: #E2E8F0; }
    .o { fill: #38BDF8; }
    .d { fill: #94A3B8; }
    .h { fill: #F472B6; }
    .y { fill: #F59E0B; }
  </style>

  <!-- window -->
  <rect x="0" y="0" width="860" height="490" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="859" height="489" rx="14" fill="none" stroke="#1e293b"/>

  <!-- moving scanline -->
  <g clip-path="url(#win)">
    <rect x="0" y="-80" width="860" height="80" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 580" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title bar -->
  <rect x="0" y="0" width="860" height="38" rx="14" fill="#111a2e"/>
  <rect x="0" y="24" width="860" height="14" fill="#111a2e"/>
  <rect x="0" y="38" width="860" height="2" fill="url(#bar)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="430" y="24" text-anchor="middle" class="d" style="font-size:13px">alisha@github: ~</text>

  <!-- 1: whoami -->
  <g clip-path="url(#c1)" filter="url(#glow)">
    <text x="40" y="90"><tspan class="p">$</tspan><tspan class="c"> whoami</tspan></text>
  </g>
  <text x="40" y="115" class="h" opacity="0" filter="url(#glow)">Alisha Vashishth · full-stack dev building AI products
    <set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/>
  </text>

  <!-- 2: builds -->
  <g clip-path="url(#c2)" filter="url(#glow)">
    <text x="40" y="150"><tspan class="p">$</tspan><tspan class="c"> cat builds.txt</tspan></text>
  </g>
  <text x="40" y="175" opacity="0">
    <tspan class="p">→</tspan><tspan class="o"> RAG chatbots that answer from real data</tspan>
    <set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/>
  </text>
  <text x="40" y="198" opacity="0">
    <tspan class="p">→</tspan><tspan class="o"> hybrid recommenders (content + behavior)</tspan>
    <set attributeName="opacity" to="1" begin="3.6s" fill="freeze"/>
  </text>
  <text x="40" y="221" opacity="0">
    <tspan class="p">→</tspan><tspan class="o"> computer-vision models that flag damage</tspan>
    <set attributeName="opacity" to="1" begin="4s" fill="freeze"/>
  </text>
  <text x="40" y="244" opacity="0">
    <tspan class="p">→</tspan><tspan class="o"> AI mentors that coach real financial behavior</tspan>
    <set attributeName="opacity" to="1" begin="4.4s" fill="freeze"/>
  </text>

  <!-- 3: stack -->
  <g clip-path="url(#c3)" filter="url(#glow)">
    <text x="40" y="279"><tspan class="p">$</tspan><tspan class="c"> cat stack.txt</tspan></text>
  </g>
  <text x="40" y="304" class="o" opacity="0">Next.js · FastAPI · PostgreSQL · PyTorch · LangChain · FAISS · Docker
    <set attributeName="opacity" to="1" begin="6.3s" fill="freeze"/>
  </text>

  <!-- 4: certs -->
  <g clip-path="url(#c4)" filter="url(#glow)">
    <text x="40" y="339"><tspan class="p">$</tspan><tspan class="c"> cat certs.txt</tspan></text>
  </g>
  <text x="40" y="364" opacity="0">
    <tspan class="y">Azure AI-900</tspan><tspan class="d"> · </tspan><tspan class="y">DP-900</tspan><tspan class="d"> · </tspan><tspan class="y">AZ-900</tspan><tspan class="d">   (3x Microsoft certified)</tspan>
    <set attributeName="opacity" to="1" begin="8.1s" fill="freeze"/>
  </text>

  <!-- 5: status -->
  <g clip-path="url(#c5)" filter="url(#glow)">
    <text x="40" y="399"><tspan class="p">$</tspan><tspan class="c"> echo $STATUS</tspan></text>
  </g>
  <text x="40" y="424" opacity="0">
    <tspan class="p">●</tspan><tspan class="c"> open to internships &amp; collaborations — let's build something</tspan>
    <set attributeName="opacity" to="1" begin="9.8s" fill="freeze"/>
  </text>

  <!-- prompt + cursor -->
  <text x="40" y="459" opacity="0" class="p">$
    <set attributeName="opacity" to="1" begin="10.4s" fill="freeze"/>
  </text>
  <rect x="58" y="446" width="10" height="17" fill="#14B8A6" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="10.4s" repeatCount="indefinite"/>
  </rect>
</svg>
