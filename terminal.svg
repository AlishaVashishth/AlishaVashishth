<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="Terminal session for Alisha Vashishth: about, builds, certs, status">
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="860" height="400" rx="10"/></clipPath>

    <clipPath id="c1"><rect x="40" y="62" width="0" height="26">
      <set attributeName="width" to="153" begin="0.5s" fill="freeze"/>
      <animate attributeName="width" from="153" to="274" dur="0.9s" begin="0.9s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="40" y="116" width="0" height="26">
      <set attributeName="width" to="153" begin="2.4s" fill="freeze"/>
      <animate attributeName="width" from="153" to="283" dur="0.95s" begin="2.8s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="40" y="236" width="0" height="26">
      <set attributeName="width" to="153" begin="5.5s" fill="freeze"/>
      <animate attributeName="width" from="153" to="274" dur="0.9s" begin="5.9s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="40" y="290" width="0" height="26">
      <set attributeName="width" to="153" begin="7.7s" fill="freeze"/>
      <animate attributeName="width" from="153" to="265" dur="0.85s" begin="8.1s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','SFMono-Regular','Menlo',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; font-size: 15px; white-space: pre; }
    .u { fill: #3fb950; font-weight: 700; }
    .w { fill: #c9d1d9; }
    .b { fill: #58a6ff; font-weight: 700; }
    .t { fill: #c9d1d9; }
    .g { fill: #8b949e; }
    .a { fill: #d29922; }
  </style>

  <!-- window -->
  <g clip-path="url(#win)">
    <rect x="0" y="0" width="860" height="400" fill="#0d1117"/>
    <rect x="0" y="0" width="860" height="36" fill="#161b22"/>
    <rect x="0" y="36" width="860" height="1" fill="#30363d"/>
  </g>
  <rect x="0.5" y="0.5" width="859" height="399" rx="10" fill="none" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="430" y="23" text-anchor="middle" class="g" style="font-size:13px">alisha@github: ~</text>

  <!-- 1: about -->
  <g clip-path="url(#c1)">
    <text x="40" y="80"><tspan class="u">alisha@github</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ cat about.txt</tspan></text>
  </g>
  <text x="40" y="102" class="t" opacity="0">Alisha Vashishth · full-stack developer building AI products
    <set attributeName="opacity" to="1" begin="2s" fill="freeze"/>
  </text>

  <!-- 2: builds -->
  <g clip-path="url(#c2)">
    <text x="40" y="134"><tspan class="u">alisha@github</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ cat builds.txt</tspan></text>
  </g>
  <text x="40" y="156" opacity="0"><tspan class="g">- </tspan><tspan class="t">RAG chatbots that answer from real data</tspan>
    <set attributeName="opacity" to="1" begin="3.9s" fill="freeze"/>
  </text>
  <text x="40" y="178" opacity="0"><tspan class="g">- </tspan><tspan class="t">hybrid recommenders (content + behavior)</tspan>
    <set attributeName="opacity" to="1" begin="4.2s" fill="freeze"/>
  </text>
  <text x="40" y="200" opacity="0"><tspan class="g">- </tspan><tspan class="t">computer-vision models that flag damage</tspan>
    <set attributeName="opacity" to="1" begin="4.5s" fill="freeze"/>
  </text>
  <text x="40" y="222" opacity="0"><tspan class="g">- </tspan><tspan class="t">AI mentors that coach real financial behavior</tspan>
    <set attributeName="opacity" to="1" begin="4.8s" fill="freeze"/>
  </text>

  <!-- 3: certs -->
  <g clip-path="url(#c3)">
    <text x="40" y="254"><tspan class="u">alisha@github</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ cat certs.txt</tspan></text>
  </g>
  <text x="40" y="276" opacity="0"><tspan class="a">Azure AI-900  DP-900  AZ-900  PL-300</tspan><tspan class="g">   # 4x Microsoft certified</tspan>
    <set attributeName="opacity" to="1" begin="7s" fill="freeze"/>
  </text>

  <!-- 4: status -->
  <g clip-path="url(#c4)">
    <text x="40" y="308"><tspan class="u">alisha@github</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ echo $STATUS</tspan></text>
  </g>
  <text x="40" y="330" opacity="0"><tspan class="u">●</tspan><tspan class="t"> open to internships &amp; collaborations</tspan>
    <set attributeName="opacity" to="1" begin="9s" fill="freeze"/>
  </text>

  <!-- final prompt + cursor -->
  <text x="40" y="362" opacity="0"><tspan class="u">alisha@github</tspan><tspan class="w">:</tspan><tspan class="b">~</tspan><tspan class="w">$ </tspan>
    <set attributeName="opacity" to="1" begin="9.7s" fill="freeze"/>
  </text>
  <rect x="193" y="348" width="9" height="17" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="9.7s" repeatCount="indefinite"/>
  </rect>
</svg>
